<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامج تسعير الأعمال الكهربائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;-webkit-font-smoothing:antialiased}

/* Global CSS Variables - available to all elements */
html, body {
  --bg:#FAFAF7;
  --bg-soft:#F4F3EE;
  --surface:#FFFFFF;
  --line:#E9E7E0;
  --line-strong:#D9D6CC;
  --ink:#0A0A0A;
  --ink-2:#3A3A37;
  --ink-3:#6E6C66;
  --ink-4:#A8A59C;
  --accent:#0A0A0A;
  --accent-soft:#F0EEE7;
  --pos:#2F6F4E;
  --pos-bg:#E7F0EA;
  --warn:#B25D2B;
  --warn-bg:#F5EBE2;
  --neg:#9F2D2D;
  --neg-bg:#F4E6E5;
  --info:#2C5A8A;
  --info-bg:#E5EBF2;
}

html.dark, body.dark {
  --bg:#0E0E0C;
  --bg-soft:#161614;
  --surface:#1A1916;
  --line:#2A2926;
  --line-strong:#3A3934;
  --ink:#F5F4F0;
  --ink-2:#D8D6CF;
  --ink-3:#9C9A92;
  --ink-4:#66645E;
  --accent:#F5F4F0;
  --accent-soft:#232220;
  --pos-bg:#1B2A22;
  --warn-bg:#2A201A;
  --neg-bg:#2A1C1C;
  --info-bg:#1A2230;
}

body{font-family:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;background:var(--bg);color:var(--ink)}

/* Theme — Option A (light/dark) */
.theme-a, body.theme-a {
  --bg:#FAFAF7;
  --bg-soft:#F4F3EE;
  --surface:#FFFFFF;
  --line:#E9E7E0;
  --ink:#0A0A0A;
  --ink-2:#3A3A37;
  --ink-3:#6E6C66;
  --accent:#0A0A0A;
  --pos:#2F6F4E;
  --pos-bg:#E7F0EA;
  --warn:#B25D2B;
  --warn-bg:#F5EBE2;
  --neg:#9F2D2D;
  --neg-bg:#F4E6E5;
  --info:#2C5A8A;
  --info-bg:#E5EBF2;
}
.theme-a.dark{
  --bg:#0E0E0C;
  --bg-soft:#161614;
  --surface:#1A1916;
  --line:#2A2926;
  --ink:#FFFFFF;
  --ink-2:#E8E8E8;
  --ink-3:#B0B0B0;
}

/* Theme — Option B (navy/amber) */
.theme-b, body.theme-b {
  --bg:#F6F4EE;
  --bg-soft:#ECE8DD;
  --surface:#FFFFFF;
  --line:#E2DCCB;
  --ink:#1B1F2A;
  --ink-2:#3A4055;
  --ink-3:#6B7088;
  --accent:#1B2540;
  --accent-2:#C68A2E;
  --pos:#2F6F4E;
  --pos-bg:#E2EDE5;
  --warn:#B25D2B;
  --warn-bg:#F4E7D5;
  --neg:#9F2D2D;
  --neg-bg:#F1E1DF;
  --info:#2C5A8A;
  --info-bg:#DDE6F0;
}
.theme-b.dark{
  --bg:#11141C;
  --bg-soft:#181C26;
  --surface:#1C2030;
  --line:#2A2F3F;
  --ink:#FFFFFF;
  --ink-2:#E0DCCE;
  --ink-3:#A0A0B0;
  --accent:#E6CB8E;
  --accent-2:#E6CB8E;
}

#root{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--ink);
}

#root.theme-a {
  --bg:#FAFAF7;
  --bg-soft:#F4F3EE;
  --surface:#FFFFFF;
  --line:#E9E7E0;
  --ink:#0A0A0A;
  --ink-2:#3A3A37;
  --ink-3:#6E6C66;
  --accent:#0A0A0A;
  --pos:#2F6F4E;
  --pos-bg:#E7F0EA;
  --warn:#B25D2B;
  --warn-bg:#F5EBE2;
  --neg:#9F2D2D;
  --neg-bg:#F4E6E5;
  --info:#2C5A8A;
  --info-bg:#E5EBF2;
  background:var(--bg);
  color:var(--ink);
}

#root.theme-a.dark {
  --bg:#0E0E0C;
  --bg-soft:#161614;
  --surface:#1A1916;
  --line:#2A2926;
  --ink:#FFFFFF;
  --ink-2:#E8E8E8;
  --ink-3:#B0B0B0;
  background:var(--bg);
  color:var(--ink);
}

#root.theme-b {
  --bg:#F6F4EE;
  --bg-soft:#ECE8DD;
  --surface:#FFFFFF;
  --line:#E2DCCB;
  --ink:#1B1F2A;
  --ink-2:#3A4055;
  --ink-3:#6B7088;
  --accent:#1B2540;
  --accent-2:#C68A2E;
  --pos:#2F6F4E;
  --pos-bg:#E2EDE5;
  --warn:#B25D2B;
  --warn-bg:#F4E7D5;
  --neg:#9F2D2D;
  --neg-bg:#F1E1DF;
  --info:#2C5A8A;
  --info-bg:#DDE6F0;
  background:var(--bg);
  color:var(--ink);
}

#root.theme-b.dark{
  --bg:#11141C;
  --bg-soft:#181C26;
  --surface:#1C2030;
  --line:#2A2F3F;
  --ink:#FFFFFF;
  --ink-2:#E0DCCE;
  --ink-3:#A0A0B0;
  --accent:#E6CB8E;
  --accent-2:#E6CB8E;
  background:var(--bg);
  color:var(--ink);
}

.app-container{
  width:100%;
  height:100%;
  max-height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
}

.app-content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  min-height: 0;
  padding-bottom:80px;
}

.bottom-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  flex-shrink:0;
  background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(90px, 1fr));
  gap:4px;
  overflow-x:auto;
  z-index:998;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:8px;
  border:none;
  background:transparent;
  cursor:pointer;
  color:var(--ink-3);
  font-size:11px;
  font-weight:500;
  border-radius:8px;
  transition:all 200ms;
}

.nav-item.active{
  background:var(--bg-soft);
  color:var(--ink);
}

.nav-item svg{
  width:24px;
  height:24px;
}

/* Cards and sections */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}

.card-primary{
  background:var(--ink);
  color:var(--bg);
  border:none;
}

.kpi-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px;
}

.kpi-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  font-size:13px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:3px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:500;
  white-space:nowrap;
}

.badge-pos{background:var(--pos-bg);color:var(--pos)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-neg{background:var(--neg-bg);color:var(--neg)}
.badge-info{background:var(--info-bg);color:var(--info)}

.table-container{
  overflow-x:auto;
  margin:16px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th{
  background:var(--bg-soft);
  padding:10px;
  text-align:right;
  font-weight:600;
  border-bottom:1px solid var(--line);
}

td{
  padding:10px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:var(--bg-soft);
}

.tweaks-panel{
  position:fixed;
  top:0;
  right:0;
  width:280px;
  height:100%;
  background:var(--surface);
  border-left:1px solid var(--line);
  padding:20px;
  overflow-y:auto;
  z-index:1000;
  transition:transform 200ms;
  transform:translateX(100%);
}

.tweaks-panel.show{
  transform:translateX(0);
}

.tweaks-panel h3{
  margin:20px 0 10px;
  font-size:13px;
  font-weight:600;
}

.tweaks-panel label{
  display:block;
  margin:8px 0;
  font-size:12px;
  cursor:pointer;
}

.tweaks-panel input{
  margin-right:6px;
}

button{
  font-family:inherit;
}

.num{
  font-variant-numeric:tabular-nums;
}

/* Hide desktop app on mobile screens */
@media (max-width:768px){
  #root { display: none !important; }
  #mobile-app { display: flex !important; }
}

/* Hide mobile app on desktop screens */
@media (min-width:769px){
  #mobile-app { display: none !important; }
  #root { display: flex !important; }
}

/* ===== MOBILE APP STYLING (min-width: 0) ===== */
#mobile-app {
  display: none;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  max-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;
  overflow: hidden;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
}

.mobile-header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px;
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  flex-shrink: 0;
}

.mobile-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px;
  padding-bottom: 70px;
}

.mobile-nav-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: var(--surface);
  border-top: 2px solid var(--line);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 999;
}

.mobile-nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 500;
  border-radius: 8px;
  transition: all 150ms;
}

.mobile-nav-btn:active {
  background: var(--bg-soft);
  color: var(--ink);
}

.mobile-nav-btn svg {
  width: 22px;
  height: 22px;
}

.mobile-screen {
  display: none;
}

.mobile-screen.active {
  display: block;
}

.mobile-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 12px;
}

.mobile-input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}

.mobile-input-group label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
}

.mobile-input-group input,
.mobile-input-group select {
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 14px;
  background: var(--bg);
  color: var(--ink);
  font-family: inherit;
}

.mobile-btn {
  width: 100%;
  padding: 12px;
  background: var(--ink);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 150ms;
}

.mobile-btn:active {
  opacity: 0.8;
}

.mobile-table {
  width: 100%;
  font-size: 12px;
  border-collapse: collapse;
}

.mobile-table th,
.mobile-table td {
  padding: 8px;
  text-align: right;
  border-bottom: 1px solid var(--line);
}

.mobile-table th {
  background: var(--bg-soft);
  font-weight: 600;
}
</style>
</head>

// Load real data from JSON
function loadRealData() {
  return new Promise((resolve) => {
    // Use embedded data (works in all environments including Streamlit Cloud)
    const products = EMBEDDED_PRODUCTS;

    if (!products || products.length === 0) {
      console.warn('No products loaded, using defaults');
      resolve();
      return;
    }

    // Group by store
    const storeMap = {};
    let totalPrice = 0;
    let minPrice = Infinity;
    let maxPrice = 0;

    products.forEach(product => {
      const store = product.store || 'غير محدد';
      const price = parseFloat(product.price) || 0;

      if (!storeMap[store]) {
        storeMap[store] = [];
      }
      storeMap[store].push(product);

      totalPrice += price;
      minPrice = Math.min(minPrice, price);
      maxPrice = Math.max(maxPrice, price);
    });

    // Build stores array
    APP_DATA.stores = Object.entries(storeMap).map(([name, items], idx) => ({
      id: idx + 1,
      name: name,
      productCount: items.length,
      avgPrice: Math.round((items.reduce((sum, p) => sum + (p.price || 0), 0) / items.length) * 100) / 100,
    }));

    // Build materials array (first 20 unique products)
    const uniqueProducts = {};
    products.forEach(p => {
      if (!uniqueProducts[p.name]) {
        uniqueProducts[p.name] = p;
      }
    });

    APP_DATA.materials = Object.values(uniqueProducts).slice(0, 20).map((p, idx) => ({
      id: idx + 1,
      name: p.name,
      unit: 'وحدة',
      price: p.price,
      stock: Math.floor(Math.random() * 200) + 50,
      store: p.store,
    }));

    // Update KPIs
    APP_DATA.kpis = {
      totalProducts: products.length,
      uniqueStores: APP_DATA.stores.length,
      avgPrice: Math.round((totalPrice / products.length) * 100) / 100,
      priceRange: `${Math.round(minPrice)} - ${Math.round(maxPrice)}`,
    };

    // Generate revenue data (mock based on real product count)
    APP_DATA.revenue = Array.from({ length: 8 }, () =>
      Math.round((APP_DATA.kpis.totalProducts / 8) * (Math.random() * 0.8 + 0.6) * 1000)
    );

    APP_DATA.loading = false;
    resolve();
  });
}

// Format number
const fmt = (n) => new Intl.NumberFormat('ar-KW').format(Math.round(n));

// Icon component
function Icon({ name, size = 24 }) {
  const icons = {
    dashboard: '📊', projects: '📁', plus: '➕', catalog: '🛍️', reports: '📈',
    home: '🏠', settings: '⚙️', menu: '☰', close: '✕',
  };
  return <span style={{ fontSize: size }}>{icons[name] || '•'}</span>;
}

// Materials table screen
function MaterialsTableScreen() {
  const [materials, setMaterials] = React.useState([
    { id: Date.now(), product: '', quantity: 1, unitPrice: 0, total: 0 }
  ]);

  const addRow = () => {
    setMaterials([...materials, { id: Date.now(), product: '', quantity: 1, unitPrice: 0, total: 0 }]);
  };

  const removeRow = (id) => {
    setMaterials(materials.filter(m => m.id !== id));
  };

  const updateRow = (id, field, value) => {
    setMaterials(materials.map(m => {
      if (m.id === id) {
        const updated = { ...m, [field]: value };
        if (field === 'quantity' || field === 'unitPrice') {
          updated.total = (parseFloat(updated.quantity) || 0) * (parseFloat(updated.unitPrice) || 0);
        }
        return updated;
      }
      return m;
    }));
  };

  const updateProduct = (id, productName) => {
    const product = APP_DATA.materials.find(p => p.name === productName);
    if (product) {
      // Update both product and price in a single state update
      setMaterials(materials.map(m => {
        if (m.id === id) {
          const updated = {
            ...m,
            product: productName,
            unitPrice: product.price,
          };
          updated.total = (parseFloat(updated.quantity) || 0) * (parseFloat(updated.unitPrice) || 0);
          return updated;
        }
        return m;
      }));
    }
  };

  const total = materials.reduce((sum, m) => sum + (m.total || 0), 0);

  const exportWord = async () => {
    const doc = new (window.docx || {}).Document();
    alert('تصدير Word قريباً - استخدم Excel الآن');
  };

  const exportExcel = () => {
    let csv = 'المنتج,الكمية,السعر (د.ك),المجموع (د.ك)\n';
    materials.forEach(m => {
      csv += `"${m.product}",${m.quantity},${m.unitPrice},${m.total}\n`;
    });
    csv += `,,الإجمالي,${total}`;

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `materials-${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
  };

  return (
    <div style={{ padding: '16px' }}>
      <h2 style={{ marginTop: 0 }}>📋 جدول المواد</h2>

      <div className="table-container">
        <table style={{ marginBottom: 16 }}>
          <thead>
            <tr>
              <th>المنتج</th>
              <th>الكمية</th>
              <th>السعر الفردي (د.ك)</th>
              <th>المجموع (د.ك)</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody>
            {materials.map(m => (
              <tr key={m.id} style={{ background: m.product ? 'var(--info-bg)' : 'transparent', borderLeft: m.product ? '4px solid var(--info)' : 'none' }}>
                <td style={{ minWidth: 300, padding: '12px' }}>
                  {/* Show selected product prominently */}
                  <div style={{ marginBottom: 10 }}>
                    {m.product && (
                      <div style={{ background: 'linear-gradient(135deg, var(--info-bg) 0%, var(--surface) 100%)', padding: '8px 12px', borderRadius: 6, border: '2px solid var(--info)', display: 'block' }}>
                        <div style={{ fontSize: 10, color: 'var(--ink-3)', marginBottom: 3, fontWeight: 600 }}>✅ المنتج المختار</div>
                        <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--info)' }}>{m.product}</div>
                      </div>
                    )}
                  </div>

                  {/* Dropdown for selection */}
                  <select
                    value={m.product || ''}
                    onChange={e => {
                      const selectedValue = e.target.value;
                      if (selectedValue) {
                        updateProduct(m.id, selectedValue);
                      }
                    }}
                    style={{
                      width: '100%',
                      padding: '10px',
                      borderRadius: '6px',
                      border: m.product ? '2px solid var(--info)' : '1px solid var(--line)',
                      fontSize: 13,
                      fontWeight: 500,
                      background: 'var(--surface)',
                      color: m.product ? 'var(--info)' : 'var(--ink)',
                    }}
                  >
                    <option value="">📦 اختر منتج...</option>
                    {APP_DATA.materials.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                  </select>
                </td>
                <td style={{ textAlign: 'center' }}>
                  <input
                    type="number"
                    value={m.quantity}
                    onChange={e => updateRow(m.id, 'quantity', e.target.value)}
                    style={{ width: '70px', padding: '8px', borderRadius: '6px', border: '1px solid var(--line)', textAlign: 'center', fontWeight: 600 }}
                    min="1"
                  />
                </td>
                <td className="num" style={{ textAlign: 'center', fontWeight: 600 }}>{fmt(m.unitPrice)}</td>
                <td className="num" style={{ textAlign: 'center' }}>
                  <div style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)', background: 'var(--bg-soft)', padding: 8, borderRadius: 6 }}>{fmt(m.total)}</div>
                </td>
                <td style={{ textAlign: 'center' }}>
                  <button onClick={() => removeRow(m.id)} style={{ padding: '8px 12px', borderRadius: '6px', border: '1px solid var(--neg)', background: 'var(--neg-bg)', color: 'var(--neg)', cursor: 'pointer', fontWeight: 600 }}>حذف</button>

          <div>
            <h3 style={{ margin: 0 }}>الإجمالي</h3>
            <p style={{ margin: '4px 0 0', color: 'var(--ink-3)', fontSize: 12 }}>عدد البنود: {materials.length}</p>
          </div>
          <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--accent)' }} className="num">{fmt(total)} د.ك</div>
        </div>
      </div>

      {/* Buttons */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
        <button
          onClick={addRow}
          style={{ padding: '10px', borderRadius: '8px', border: 'none', background: 'var(--info-bg)', color: 'var(--info)', fontWeight: 600, cursor: 'pointer' }}
        >
          ➕ إضافة صف
        </button>
        <button
          onClick={exportExcel}
          style={{ padding: '10px', borderRadius: '8px', border: 'none', background: 'var(--pos-bg)', color: 'var(--pos)', fontWeight: 600, cursor: 'pointer' }}
        >
          📊 تصدير Excel
        </button>
        <button
          onClick={exportWord}
          style={{ padding: '10px', borderRadius: '8px', border: 'none', background: 'var(--warn-bg)', color: 'var(--warn)', fontWeight: 600, cursor: 'pointer' }}
        >
          📄 تصدير Word
        </button>
      </div>
    </div>
  );
}

        <p style={{ fontSize: 12, color: 'var(--ink-3)', marginBottom: 10 }}>تكرار التحديث الآمن:</p>

        <select
          value={updateFrequency}
          onChange={e => {
            setUpdateFrequency(e.target.value);
            localStorage.setItem('updateFrequency', e.target.value);
          }}
          style={{ width: '100%', padding: '8px', borderRadius: '8px', border: '1px solid var(--line)' }}
        >
          <option value="daily">يومي (غير موصى به - قد ينتهك الخدمة)</option>
          <option value="weekly">أسبوعي</option>
          <option value="monthly">شهري (الموصى به)</option>
          <option value="quarterly">ربع سنوي</option>
        </select>

        <div style={{ marginTop: 12, padding: 10, background: 'var(--pos-bg)', borderRadius: 6, fontSize: 12, color: 'var(--pos)' }}>
          <strong>✅ الخيار الحالي:</strong> {updateFrequency === 'monthly' ? 'شهري (آمن وقانوني)' : 'اختبر التكرار'}
        </div>
      </div>

      {/* Update Log */}
      <div className="card">
        <h3>📜 سجل التحديثات</h3>

        {updateLog.length === 0 ? (
          <p style={{ color: 'var(--ink-3)', textAlign: 'center' }}>لم يتم تحديث البيانات بعد</p>
        ) : (
          <div style={{ maxHeight: 300, overflowY: 'auto' }}>
            {updateLog.map((log, idx) => (
              <div key={idx} style={{ padding: 8, marginBottom: 8, background: 'var(--bg-soft)', borderRadius: 6, fontSize: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                  <strong>{log.status}</strong>
                  <span style={{ color: 'var(--ink-3)' }}>{log.date}</span>
                </div>
                <div style={{ color: 'var(--ink-3)' }}>
                  • تحديث: {log.productsUpdated} منتج من {log.storesUpdated} متجر
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Safety Notice */}
      <div style={{ marginTop: 16, padding: 12, background: 'var(--neg-bg)', borderRadius: 8, color: 'var(--neg)', fontSize: 12 }}>
        <strong>⚠️ ملاحظة قانونية مهمة:</strong>
        <p style={{ margin: '8px 0 0 0' }}>
          هذا التطبيق يتوافق مع المعايير القانونية والأخلاقية:
        </p>
        <ul style={{ margin: 8, paddingRight: 20, fontSize: 11 }}>
          <li>تحديث البيانات مرة واحدة فقط شهرياً</li>
          <li>دعوة صريحة من الإدارة للتحديث</li>
          <li>سجل تدقيق كامل للجميع التحديثات</li>
          <li>احترام سياسات خدمة المتاجر الأخرى</li>
        </ul>
      </div>

      {/* Logout */}
      <button
        onClick={() => setIsAuthenticated(false)}
        style={{ width: '100%', marginTop: 16, padding: '10px', borderRadius: '8px', border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-3)', cursor: 'pointer' }}
      >
        تسجيل الخروج
      </button>
    </div>
  );
}

// Mobile App Component
function MobileApp() {
  const [activeScreen, setActiveScreen] = React.useState('home');
  const [searchQuery, setSearchQuery] = React.useState('');
  const [materials, setMaterials] = React.useState([{ id: 1, product: '', quantity: 1, unitPrice: 0, total: 0 }]);
  const [theme, setTheme] = React.useState(localStorage.getItem('theme') || 'light');

  React.useEffect(() => {
    // Apply theme to html element
    const htmlElement = document.documentElement;
    if (theme === 'dark') {
      htmlElement.classList.add('dark');
    } else {
      htmlElement.classList.remove('dark');
    }
    localStorage.setItem('theme', theme);
  }, [theme]);

  const allProducts = APP_DATA.materials || [];
  const filteredProducts = allProducts.filter(p =>
    p.name.includes(searchQuery) || searchQuery === ''
  );

  const handleAddMaterial = () => {
    setMaterials([...materials, {
      id: Date.now(),
      product: '',
      quantity: 1,
      unitPrice: 0,
      total: 0
    }]);
  };

  const handleRemoveMaterial = (id) => {
    if (materials.length > 1) {
      setMaterials(materials.filter(m => m.id !== id));
    }
  };

  const handleMaterialChange = (id, field, value) => {
    setMaterials(materials.map(m => {
      if (m.id === id) {
        const updated = { ...m, [field]: value };
        if (field === 'product') {
          const product = allProducts.find(p => p.name === value);
          if (product) {
            updated.unitPrice = product.price;
          }
        }
        if (field === 'quantity' || field === 'unitPrice') {
          updated.total = (parseFloat(updated.quantity) || 0) * (parseFloat(updated.unitPrice) || 0);
        }
        return updated;
      }
      return m;
    }));
  };

  const totalAmount = materials.reduce((sum, m) => sum + (m.total || 0), 0);

  return (
    <div id="mobile-app" style={{ display: 'flex', flexDirection: 'column', width: '100%', height: '100vh' }}>
      {/* Header */}
      <div className="mobile-header" style={{ background: 'var(--ink)', color: 'var(--bg)', padding: '14px 16px' }}>
        ⚡ برنامج التسعير الكهربائي
      </div>

      {/* Content */}
      <div className="mobile-content">
        {activeScreen === 'home' && (
          <div>
            <div className="mobile-card" style={{ textAlign: 'center' }}>
              <h2 style={{ margin: '10px 0', fontSize: '18px' }}>📊 ملخص البيانات</h2>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginTop: '10px' }}>
                <div style={{ background: 'var(--bg-soft)', padding: '10px', borderRadius: '8px' }}>
                  <div style={{ fontSize: '11px', color: 'var(--ink-3)' }}>المنتجات</div>
                  <div style={{ fontSize: '20px', fontWeight: 'bold', color: 'var(--ink)' }}>{APP_DATA.kpis.totalProducts}</div>
                </div>
                <div style={{ background: 'var(--bg-soft)', padding: '10px', borderRadius: '8px' }}>
                  <div style={{ fontSize: '11px', color: 'var(--ink-3)' }}>المتاجر</div>
                  <div style={{ fontSize: '20px', fontWeight: 'bold', color: 'var(--ink)' }}>{APP_DATA.stores.length}</div>
                </div>
                <div style={{ background: 'var(--bg-soft)', padding: '10px', borderRadius: '8px' }}>
                  <div style={{ fontSize: '11px', color: 'var(--ink-3)' }}>السعر المتوسط</div>
                  <div style={{ fontSize: '16px', fontWeight: 'bold', color: 'var(--ink)' }}>{APP_DATA.kpis.avgPrice.toFixed(2)} د.ك</div>
                </div>
                <div style={{ background: 'var(--bg-soft)', padding: '10px', borderRadius: '8px' }}>
                  <div style={{ fontSize: '11px', color: 'var(--ink-3)' }}>النطاق</div>
                  <div style={{ fontSize: '14px', fontWeight: 'bold', color: 'var(--ink)' }}>{APP_DATA.kpis.priceRange}</div>
                </div>
              </div>
            </div>

            <div className="mobile-card">
              <h3 style={{ margin: '0 0 10px 0', fontSize: '14px', fontWeight: '600' }}>📦 أفضل المتاجر</h3>
              {APP_DATA.stores.slice(0, 5).map((store, idx) => (
                <div key={idx} style={{ padding: '8px 0', borderBottom: idx < 4 ? '1px solid var(--line)' : 'none', fontSize: '13px' }}>
                  <div style={{ fontWeight: '500', color: 'var(--ink)' }}>{store.name}</div>
                  <div style={{ fontSize: '12px', color: 'var(--ink-3)' }}>
                    {store.productCount} منتج • متوسط {store.avgPrice.toFixed(2)} د.ك
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {activeScreen === 'search' && (
          <div>
            <div className="mobile-card">
              <div className="mobile-input-group">
                <label>🔍 ابحث عن منتج</label>
                <input
                  type="text"
                  placeholder="اسم المنتج..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                />
              </div>
            </div>

            {filteredProducts.map(product => (
              <div key={product.id} className="mobile-card" style={{ fontSize: '13px' }}>
                <div style={{ fontWeight: '600', color: 'var(--ink)', marginBottom: '6px' }}>{product.name}</div>
                <div style={{ fontSize: '12px', color: 'var(--ink-3)', marginBottom: '4px' }}>📍 {product.store}</div>
                <div style={{ fontSize: '14px', fontWeight: 'bold', color: 'var(--ink)' }}>{product.price.toFixed(2)} د.ك</div>
              </div>
            ))}
          </div>
        )}

        {activeScreen === 'materials' && (
          <div>
            <div className="mobile-card">
              <h3 style={{ margin: '0 0 12px 0', fontSize: '14px', fontWeight: '600' }}>📋 جدول المواد</h3>

              {materials.map((material, idx) => (
                <div key={material.id} style={{ marginBottom: '12px', padding: '10px', background: 'var(--bg-soft)', borderRadius: '8px' }}>
                  <div className="mobile-input-group">
                    <label>المنتج</label>
                    <select
                      value={material.product}
                      onChange={e => handleMaterialChange(material.id, 'product', e.target.value)}
                      style={{ fontSize: '13px' }}
                    >
                      <option value="">اختر منتج</option>
                      {allProducts.map((p, i) => (
                        <option key={i} value={p.name}>{p.name}</option>
                      ))}
                    </select>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                    <div className="mobile-input-group">
                      <label>الكمية</label>
                      <input
                        type="number"
                        value={material.quantity}
                        onChange={e => handleMaterialChange(material.id, 'quantity', e.target.value)}
                        min="1"
                      />
                    </div>
                    <div className="mobile-input-group">
                      <label>السعر الفردي</label>
                      <input
                        type="number"
                        value={material.unitPrice.toFixed(2)}
                        disabled
                      />
                    </div>
                  </div>

                  <div style={{ padding: '8px', background: 'var(--bg)', borderRadius: '6px', marginTop: '8px', textAlign: 'center', fontWeight: '600', fontSize: '13px', color: 'var(--ink)' }}>
                    المجموع: {material.total.toFixed(2)} د.ك
                  </div>

                  {materials.length > 1 && (
                    <button
                      onClick={() => handleRemoveMaterial(material.id)}
                      style={{ width: '100%', marginTop: '8px', padding: '8px', background: 'var(--neg-bg)', color: 'var(--neg)', border: 'none', borderRadius: '6px', fontSize: '12px', cursor: 'pointer', fontWeight: '500' }}
                    >
                      ❌ حذف
                    </button>
                  )}
                </div>
              ))}

              <button
                onClick={handleAddMaterial}
                className="mobile-btn"
                style={{ marginTop: '10px' }}
              >
                ➕ إضافة صف جديد
              </button>

              <div style={{ marginTop: '14px', padding: '12px', background: 'var(--info-bg)', borderRadius: '8px', textAlign: 'center', borderLeft: '4px solid var(--info)' }}>
                <div style={{ fontSize: '12px', color: 'var(--ink-3)', marginBottom: '4px' }}>الإجمالي النهائي</div>
                <div style={{ fontSize: '20px', fontWeight: 'bold', color: 'var(--ink)' }}>{totalAmount.toFixed(2)} د.ك</div>
              </div>
            </div>
          </div>
        )}

        {activeScreen === 'stores' && (
          <div>
            <h2 style={{ margin: '0 0 12px 0', fontSize: '16px', fontWeight: '600' }}>🏪 المتاجر</h2>
            {APP_DATA.stores.map((store, idx) => (
              <div key={idx} className="mobile-card">
                <div style={{ fontWeight: '600', fontSize: '14px', color: 'var(--ink)', marginBottom: '8px' }}>{store.name}</div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', fontSize: '12px' }}>
                  <div style={{ background: 'var(--bg-soft)', padding: '8px', borderRadius: '6px' }}>
                    <div style={{ color: 'var(--ink-3)' }}>المنتجات</div>
                    <div style={{ fontWeight: '600', fontSize: '14px', color: 'var(--ink)' }}>{store.productCount}</div>
                  </div>
                  <div style={{ background: 'var(--bg-soft)', padding: '8px', borderRadius: '6px' }}>
                    <div style={{ color: 'var(--ink-3)' }}>السعر المتوسط</div>
                    <div style={{ fontWeight: '600', fontSize: '14px', color: 'var(--ink)' }}>{store.avgPrice.toFixed(2)} د.ك</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        {activeScreen === 'settings' && (
          <div>
            <div className="mobile-card">
              <h3 style={{ margin: '0 0 14px 0', fontSize: '14px', fontWeight: '600' }}>⚙️ الإعدادات</h3>

              <div style={{ marginBottom: '14px' }}>
                <label style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer' }}>
                  <input
                    type="checkbox"
                    checked={theme === 'dark'}
                    onChange={e => setTheme(e.target.checked ? 'dark' : 'light')}
                  />
                  <span style={{ fontSize: '13px' }}>🌙 الوضع الليلي</span>
                </label>
              </div>

              <div style={{ padding: '10px', background: 'var(--info-bg)', borderRadius: '8px', fontSize: '12px', color: 'var(--info)', lineHeight: '1.5' }}>
                <strong>ℹ️ نسخة الجوال</strong><br/>
                برنامج التسعير الكهربائي<br/>
                v1.0.0 - May 2026<br/>
                تم التطوير بواسطة Claude
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Bottom Navigation */}
      <div className="mobile-nav-bar">
        <button
          className="mobile-nav-btn"
          onClick={() => setActiveScreen('home')}
          style={{ color: activeScreen === 'home' ? 'var(--ink)' : 'var(--ink-3)', background: activeScreen === 'home' ? 'var(--bg-soft)' : 'transparent' }}
        >
          🏠<br/><span style={{fontSize: '10px'}}>الرئيسية</span>
        </button>
        <button
          className="mobile-nav-btn"
          onClick={() => setActiveScreen('search')}
          style={{ color: activeScreen === 'search' ? 'var(--ink)' : 'var(--ink-3)', background: activeScreen === 'search' ? 'var(--bg-soft)' : 'transparent' }}
        >
          🔍<br/><span style={{fontSize: '10px'}}>البحث</span>
        </button>
        <button
          className="mobile-nav-btn"
          onClick={() => setActiveScreen('materials')}
          style={{ color: activeScreen === 'materials' ? 'var(--ink)' : 'var(--ink-3)', background: activeScreen === 'materials' ? 'var(--bg-soft)' : 'transparent' }}
        >
          📋<br/><span style={{fontSize: '10px'}}>المواد</span>
        </button>
        <button
          className="mobile-nav-btn"
          onClick={() => setActiveScreen('stores')}
          style={{ color: activeScreen === 'stores' ? 'var(--ink)' : 'var(--ink-3)', background: activeScreen === 'stores' ? 'var(--bg-soft)' : 'transparent' }}
        >
          🏪<br/><span style={{fontSize: '10px'}}>المتاجر</span>
        </button>
        <button
          className="mobile-nav-btn"
          onClick={() => setActiveScreen('settings')}
          style={{ color: activeScreen === 'settings' ? 'var(--ink)' : 'var(--ink-3)', background: activeScreen === 'settings' ? 'var(--bg-soft)' : 'transparent' }}
        >
          ⚙️<br/><span style={{fontSize: '10px'}}>الإعدادات</span>
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
